name: Arch Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel \
            git \
            meson \
            ninja \
            vala \
            gobject-introspection \
            glib2 \
            libgusb \
            libusb \
            pixman \
            nss \
            libgudev \
            cairo \
            curl

      - name: Check GLib tools
        run: |
          command -v glib-mkenums || true
          ls -l /usr/bin/glib-mkenums || true
          pacman -Qo /usr/bin/glib-mkenums || true
          pacman -Ql glib2 | grep glib-mkenums || true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Create build user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build package
        run: su - builder -c "cd '$GITHUB_WORKSPACE' && ./scripts/build-arch.sh"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: packaging/arch/*.pkg.tar.zst
